mode: paper

# Einzige Quelle für alle Grenzwerte. Wird von desk/config.py geladen
# und beim Start geprüft. Fehlende oder unplausible Werte stoppen das
# Programm.

scanner:
  pair_age_hours_min: 24
  pair_age_hours_max: 168
  market_cap_usd_min: 300000
  market_cap_usd_max: 20000000
  # Bestehen nur mit gemeldeter Umlaufmenge. Die Schätzung aus der
  # Gesamtmenge ist eine Obergrenze und kann nur eine Ablehnung
  # begründen (siehe desk/market_cap.py).
  # Höchstzahl RugCheck-/Holder-Prüfungen pro Lauf (bisher fest im Code)
  max_security_checks_per_run: 30

risk_filters:
  require_mint_authority_revoked: true
  require_lp_burned_or_locked: true
  reject_liquidity_below_usd: 40000
  reject_top10_share_above_pct: 25
  reject_dev_share_above_pct: 3
  # Ab diesem RugCheck-Wert gilt die Liquidität als gesperrt/verbrannt
  # (bisher fest im Code)
  lp_locked_min_pct: 99.99

# Gegenprüfung zwischen Datenquellen. Größere Abweichungen machen die
# jeweilige Prüfung "unklar" (keine Freigabe, keine Ablehnung).
data_quality:
  # DexPaprika-Pool-Liquidität gegen RugCheck-Pool-Liquidität
  max_liquidity_deviation_pct: 15
  # GeckoTerminal-Preis gegen RugCheck-Preis
  max_price_deviation_pct: 10

# Vollständige Holder-Liste über Helius (desk/solana_rpc.py,
# fetch_full_holder_list). Mehr Seiten oder eine größere Slot-Spanne
# zwischen den beiden Supply-Abfragen -> Holder-Prüfung "unklar".
holders:
  # Höchstzahl Seiten zu je 1000 Token-Konten
  max_pages: 30
  # Höchster Abstand in Slots (150 ≈ 1 Minute)
  max_slot_span: 150

# Eigene On-Chain-Spanne der Marktkapitalisierung (desk/circulating_bounds.py,
# desk/market_cap.py). Untergrenze = HEURISTISCHE Wallet-Untergrenze: Bestände
# technisch wallet-ähnlicher Konten (ohne Top-10, Pool, Creator, Burn, Börsen,
# Locker, PDAs, eingefrorene Konten). Kein Nachweis eines privaten Schlüssels
# oder freier Übertragbarkeit, keine nachgewiesene Umlaufmenge. Restrisiko:
# On-Curve-Adressen ohne bekannten privaten Schlüssel.
# Obergrenze = Gesamtmenge - nachweislich verbrannt. Bestätigt nur, wenn
# p_niedrig x Untergrenze >= Minimum und p_hoch x Obergrenze <= Maximum.
market_cap_onchain_bounds:
  # Standard an (vom Nutzer freigegeben): Abfragen nur, wenn allein die
  # Marktkapitalisierung offen ist; false schaltet ab (keine Abfragen,
  # keine Credits). Die Untergrenze ist eine technische Heuristik, keine
  # echte Umlaufmenge.
  allow_onchain_bounds: true
  # Höchstzahl getMultipleAccounts-Aufrufe (je bis zu 100 Authorities)
  # pro Token und Scan; erlaubt 1 bis 10 (mehr stoppt das Programm)
  max_account_calls_per_token: 10
  # Höchster Abstand in Slots von der ersten Supply-Abfrage der
  # Holder-Liste bis zur letzten Authority-Abfrage (150 ≈ 1 Minute)
  max_slot_span: 150

paper_trading:
  max_position_pct: 8
  initial_stop_loss_pct: 6
  trailing_activation_profit_pct: 12
  trailing_distance_pct: 6
  # Gewinnsicherung in Stufen (2026-11-10, Nutzerwunsch): Lag der
  # Höchstkurs 6 % über dem Einstieg, steigt der Stop auf Einstand
  # (nach geschätzten Verkaufskosten); jede weitere 6-%-Stufe hebt ihn um
  # 6 % (Höchstkurs +12 % → Stop +6 %, +18 % → +12 % …). Kurssprünge
  # zwischen zwei Abfragen können trotzdem darunter verkaufen.
  profit_lock_step_pct: 6
  # Paper-Broker (desk/paper.py, nur Simulation). Einstiegsregel und
  # folgende Werte von Claude festgelegt (Nutzer-Delegation 2026-11-10),
  # Begründung in docs/paper_broker.md.
  # Virtuelles Startkapital in USD (gilt nur beim Anlegen des Depots)
  starting_balance_usd: 10000
  # Höchstzahl gleichzeitig offener Positionen
  max_open_positions: 5
  # Positionsgröße höchstens dieser Anteil der kleineren bestätigten
  # Pool-Liquidität (begrenzt den Preiseinfluss)
  max_pool_liquidity_share_pct: 1
  # Kleinere Käufe werden nicht ausgeführt
  min_trade_usd: 50
  # Gebühr je Kauf/Verkauf (Pool-Gebühr + Priority-Fee, konservativ)
  swap_fee_pct: 1
  # Bestätigung in zwei Scans: Pool auch im vorigen Scan bereit,
  # Abstand zwischen den Scans, höchstens diese Kursänderung bzw. dieser
  # Liquiditätsrückgang zwischen beiden Scans
  confirm_min_gap_minutes: 30
  confirm_max_gap_hours: 6
  confirm_max_price_change_pct: 15
  confirm_max_liquidity_drop_pct: 20
  # Höchste Kursänderung zwischen Scan und Einstieg (beide Richtungen)
  max_entry_price_drift_pct: 10
  # Einstieg nur, wenn der Scan höchstens so alt ist
  max_scan_age_minutes: 30
  # Kein erneuter Einstieg in denselben Token innerhalb dieser Zeit
  reentry_cooldown_hours: 24
  # Spätestens nach dieser Haltedauer wird verkauft
  max_holding_hours: 72
  # Fehlt der Kurs länger, wird die Position auf 0 abgeschrieben
  max_price_missing_hours: 24

debate:
  bear_objections_required: 3
  unresolved_objection_veto: true

trend_backtest:
  # Trend-Bot für große Coins (nur Backtest/Simulation, kein Handel).
  # Regeln und Werte vorab festgelegt, nicht nachträglich optimiert
  # (sonst passt man die Regel an die Vergangenheit an).
  # Coinbase-Handelspaare (Tageskerzen, öffentliche Schnittstelle ohne Key)
  products: [BTC-USD, ETH-USD, SOL-USD]
  # Kosten je Kauf bzw. Verkauf (Gebühr + Spread/Schlupf, konservativ)
  cost_pct_per_trade: 0.5
  start_capital_usd: 10000
  sma_short_days: 50
  sma_long_days: 200
  momentum_days: 90
