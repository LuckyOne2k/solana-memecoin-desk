name: Solana Memecoin Desk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Automatische Tests ausführen
        run: python -m pytest -v

      - name: Programm starten
        run: python -m desk

      - name: Protokoll speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add data/events.jsonl
          git diff --cached --quiet || git commit -m "Update desk event log"
          git push
