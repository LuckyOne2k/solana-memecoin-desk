name: Solana Memecoin Desk

# Scan stündlich (Minute 7, GitHub kann verzögern) oder manuell.
# Danach der Paper-Broker (nur Simulation, kein echtes Geld).
# Protokoll und Depot werden in den Branch "desk-data" geschrieben,
# nie auf main.

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read

# Gemeinsame Gruppe mit paper-monitor.yml: nie zwei Schreiber
# gleichzeitig auf desk-data.
concurrency:
  group: desk-data-write
  cancel-in-progress: false

env:
  DATA_BRANCH: desk-data
  DATA_DIR: desk-data

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Automatische Tests ausführen
        run: python -m pytest -v

  scan:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Nur für den Push in den Protokoll-Branch.
      contents: write

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v7
        with:
          # Der Scan-Code bekommt keinen Schreibzugriff auf GitHub.
          # Der Token wird nur im Speicher-Schritt verwendet.
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Protokoll-Branch vorbereiten
        id: datadir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          if git -c http.extraheader="$auth" ls-remote --exit-code --heads origin "$DATA_BRANCH" > /dev/null; then
            git -c http.extraheader="$auth" fetch --depth=1 origin "$DATA_BRANCH"
            git worktree add --detach "$DATA_DIR" FETCH_HEAD
          else
            # Erster Lauf: neuen Branch anlegen und das bisherige
            # Protokoll von main übernehmen (main bleibt unverändert).
            git worktree add --orphan -b "$DATA_BRANCH" "$DATA_DIR"
            if [ -f data/events.jsonl ]; then
              cp data/events.jsonl "$DATA_DIR/events.jsonl"
            fi
          fi

      - name: Programm starten
        id: scan
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          DEXPAPRIKA_API_KEY: ${{ secrets.DEXPAPRIKA_API_KEY }}
          DESK_LOG_FILE: ${{ github.workspace }}/desk-data/events.jsonl
        run: python -m desk

      - name: Kurzübersicht erzeugen
        # Leitet latest.json nur aus events.jsonl ab. Bei fehlgeschlagenem
        # Scan: Status "failed", keine bereiten Token, keine alten Ergebnisse.
        id: latest
        if: ${{ !cancelled() && steps.datadir.outcome == 'success' }}
        run: >-
          python -m desk.latest
          desk-data/events.jsonl desk-data/latest.json
          --scan-outcome "${{ steps.scan.outcome }}"

      - name: Paper-Broker
        # Erst Ausstiege (auch nach fehlgeschlagenem Scan), Einstiege nur
        # nach erfolgreichem, plausiblem und frischem Scan.
        id: paper
        if: ${{ !cancelled() && steps.datadir.outcome == 'success' }}
        env:
          DEXPAPRIKA_API_KEY: ${{ secrets.DEXPAPRIKA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          python -m desk.paper after-scan
          --data-dir desk-data
          --scan-outcome "${{ steps.scan.outcome }}"

      - name: Schattendepot
        # Nur Lernen: Kursentwicklung aller geprüften Token (1 h / 6 h / 24 h),
        # keine Kauf- oder Prüfentscheidung.
        id: shadow
        if: ${{ !cancelled() && steps.datadir.outcome == 'success' }}
        run: >-
          python -m desk.shadow
          --data-dir desk-data
          --scan-outcome "${{ steps.scan.outcome }}"

      - name: Protokoll speichern
        # Auch nach einem Fehler im Scan speichern, damit der Fehler
        # im Protokoll nachvollziehbar bleibt.
        if: ${{ !cancelled() && steps.datadir.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: desk-data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f events.jsonl ]; then
            echo "Kein Protokoll vorhanden, nichts zu speichern."
            exit 0
          fi

          git add events.jsonl

          # Kurzübersicht nur speichern, wenn sie in diesem Lauf erzeugt
          # wurde; sonst eine alte Datei entfernen (nie veraltet zeigen).
          if [ "${{ steps.latest.outcome }}" = "success" ] && [ -f latest.json ]; then
            git add latest.json
          else
            rm -f latest.json latest.json.tmp
            git rm -q --cached --ignore-unmatch latest.json
          fi

          # Depot nur speichern, wenn der Paper-Broker erfolgreich war.
          if [ "${{ steps.paper.outcome }}" = "success" ]; then
            for file in paper_state.json paper_trades.jsonl; do
              if [ -f "$file" ]; then git add "$file"; fi
            done
          fi

          if [ "${{ steps.shadow.outcome }}" = "success" ]; then
            for file in shadow_state.json shadow_summary.json; do
              if [ -f "$file" ]; then git add "$file"; fi
            done
          fi

          if git diff --cached --quiet; then
            echo "Keine neuen Protokolleinträge."
            exit 0
          fi

          git commit -m "Update desk event log and paper portfolio"

          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" push origin "HEAD:refs/heads/$DATA_BRANCH"
